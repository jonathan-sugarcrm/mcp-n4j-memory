slice: github-models-llm-backend
requirements:
  - id: R1
    result: pass
    evidence:
      - command: >-
          curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/v1/chat/completions
          -H "Authorization: Bearer change-me" -H "Content-Type: application/json"
          -d '{"model":"claude","messages":[{"role":"user","content":"reply with PONG only. marker: verifyR1-<ts>"}]}'
          -> 200 (independently run against a clean docker compose up, GITHUB_API_KEY
          exported to llm-proxy only)
      - api_response: >-
          Real completion envelope with genuine id/usage fields and content "PONG";
          not the claude-mock mock_response string (grep -c for the mock string -> 0)
      - log_evidence: >-
          LITELLM_LOG=DEBUG (added via a scratch compose override, deleted after use)
          on the actual llm-proxy service shows for the request:
          "litellm.acompletion(..., api_base='https://models.github.ai/inference',
          model='openai/gpt-4o-mini', ...)" immediately followed by
          "POST Request Sent from LiteLLM: curl -X POST https://models.github.ai/inference/"
          -> confirms the real upstream host is models.github.ai, NOT
          models.inference.ai.azure.com (the silent-fallback host the implementer's
          decision log flagged for the rejected github/ prefix candidates)
      - static_analysis: >-
          litellm/config.yaml diffed against git HEAD: claude model_name now
          model: openai/gpt-4o-mini, api_base: https://models.github.ai/inference,
          api_key: os.environ/GITHUB_API_KEY; old Anthropic entry preserved renamed
          to claude-anthropic (unchanged model/key); claude-mock unchanged.
          docker-compose.yml diffed: GITHUB_API_KEY added to llm-proxy.environment
          only.
    reason: null
  - id: R2
    result: pass
    evidence:
      - command: >-
          scripts/llm_smoke.py (unmodified, run from an ephemeral python:3.12-slim
          runner container on the compose network against a fully clean
          docker compose down -v / up, no config overrides on mcp/neo4j), run twice
          with distinct UUID markers -> LLM_SMOKE_OK both times
      - bolt_read: >-
          Direct Cypher read for marker llm-smoke-2a6af8ad1918:
          (m:Message)-[:MENTIONS]->(:Entity:Event:Time {name/content: "dawn"}),
          (:Entity:Location {"canyon"}), (:Entity:Object {"falcon"}) plus expected
          FIRST_MESSAGE/HAS_MESSAGE Conversation edges. Entities are genuinely
          extracted (POLE+O-typed, distinct tokens) and not verbatim/mock content.
      - log_evidence: >-
          docker compose logs llm-proxy for the same window shows exactly one real
          "POST /v1/chat/completions HTTP/1.1" 200 OK per store call (INFO level;
          full DEBUG per-request body did not reproduce as verbosely for the
          compose-managed container as it did for a standalone `docker run` with
          identical env - see verification.handoff.md §2 Missing evidence, not
          treated as blocking)
      - manual_replication: >-
          A manual client.chat.completions.create(model="claude",
          response_format={"type":"json_object"}, ...) issued from inside the mcp
          container, using the same env (OPENAI_BASE_URL/OPENAI_API_KEY/
          NAM_EXTRACTION__LLM_MODEL=claude) and the same POLE+O extraction prompt
          shape as llm_extractor.py, reproduces the identical entity extraction
          (falcon/canyon/dawn) via the real GitHub-Models-backed config, causally
          corroborating that the graph-observed entities came from a genuine
          upstream call on the only configured "claude" model (claude-mock was
          never referenced).
    reason: null
  - id: R3
    result: pass
    evidence:
      - command: "docker compose exec mcp env | grep -i github -> empty, exit 1 (independently reproduced)"
      - command: "docker compose exec mcp env | grep -i gh_token -> empty, exit 1 (independently reproduced)"
      - command: >-
          docker exec mcp-n4j-memory-mcp-1 python3 -c "socket.create_connection(('models.github.ai',443),5)"
          -> UNREACHABLE: [Errno -3] Temporary failure in name resolution
          (independently reproduced, run concurrently with a real llm-proxy call succeeding)
      - command: "docker exec mcp-n4j-memory-neo4j-1 env | grep -i github -> empty, exit 1 (independently reproduced)"
    reason: null
  - id: R4
    result: pass
    evidence:
      - command: >-
          docker exec mcp-n4j-memory-llm-proxy-1 python3 -c "socket.create_connection(('models.github.ai',443),5)"
          -> REACHABLE (independently reproduced)
      - command: >-
          docker exec mcp-n4j-memory-neo4j-1 sh -c "wget -T5 -qO /dev/null https://models.github.ai && echo REACHABLE || echo UNREACHABLE"
          -> UNREACHABLE (independently reproduced)
      - static_analysis: >-
          docker compose config networks section diffed against the pre-slice
          rendering of docker-compose.yml (git show HEAD) -> exit 0, no diff;
          confirms no new network was added and llm-egress-net (the only
          non-internal network) was reused unchanged.
    reason: null
  - id: SCOPE-env-example
    result: pass
    reason: >-
      .env.example was edited to add a GITHUB_API_KEY=change-me block, documented
      under "GitHub Models credential: llm-proxy ONLY". This is explicitly listed
      as in-scope in the specification handoff (§5), and the diff is purely
      additive (git diff .env.example shows only a new 4-line block, no existing
      line touched). Not scope creep.
  - id: SCOPE-specification-doc
    result: pass
    reason: >-
      Confirmed via git diff --stat -- docs/SPECIFICATION.md (empty) that the
      implementer did not touch the file reserved for the Reconciliation stage.
  - id: NEW-CONSTRAINT-github-prefix-routing
    result: informational
    reason: >-
      The implementer's decision log reports that LiteLLM's documented github/<model>
      provider prefix does not reliably route to models.github.ai and can silently
      proxy to models.inference.ai.azure.com instead, which is why an explicit
      openai/<model> + manual api_base override was chosen. This verification pass
      confirmed the CHOSEN config (openai/gpt-4o-mini + explicit api_base) correctly
      hits models.github.ai (see R1 evidence), but did not re-run the rejected
      github/-prefixed candidates itself since they are not part of the shipped
      change set — this specific claim is carried forward from the implementer,
      not independently reproduced.
    defect_type: new_constraint
regressions_checked:
  - description: "AC-C5/AC-G4 mutual isolation (neo4j has no GitHub credential, cannot reach models.github.ai)"
    result: no_regression
  - description: "claude-mock and claude-anthropic (renamed) entries unchanged beyond the rename"
    result: no_regression
  - description: "networks: topology (db-net, llm-net internal; llm-egress-net non-internal) unchanged"
    result: no_regression
overall: pass
