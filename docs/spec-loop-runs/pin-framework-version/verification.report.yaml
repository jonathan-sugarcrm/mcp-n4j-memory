slice: pin-framework-version
requirements:
  - id: PIN-01-happy
    result: pass
    evidence:
      - command: >-
          pip install --dry-run --ignore-installed
          --target=./pip-verify-scratch-check
          "neo4j-agent-memory[mcp,sentence-transformers,openai]==0.2.0"
      - measurement: "exit code 0; 'Would install' line contains neo4j-agent-memory-0.2.0, fastmcp-2.14.7, sentence-transformers-5.6.0, openai-2.45.0 (~140 packages, no conflicts)"
  - id: PIN-01-failure
    result: pass
    evidence:
      - command: >-
          pip install --dry-run --ignore-installed
          --target=./pip-verify-scratch-check2
          "neo4j-agent-memory[mcp,sentence-transformers,openai]==99.0.0"
      - measurement: >-
          exit code 1; "ERROR: Could not find a version that satisfies the
          requirement neo4j-agent-memory==99.0.0 (from versions: 0.0.1, 0.0.2,
          0.0.3a1, 0.0.3, 0.0.4, 0.0.5, 0.1.0, 0.1.1, 0.1.2, 0.2.0, 0.2.1,
          0.4.0, 0.5.0)"; 0.2.0 present in the available-versions list,
          proving discriminating power
  - id: PIN-02-dockerfile-diff
    result: pass
    evidence:
      - command: 'grep -n "neo4j-agent-memory" docker/mcp.Dockerfile'
      - command: 'git diff -- docker/mcp.Dockerfile'
      - static_analysis: >-
          docker/mcp.Dockerfile line 13 (not line 14 as cited in the spec/impl
          handoffs — see note) reads exactly
          neo4j-agent-memory[mcp,sentence-transformers,openai]==0.2.0; git
          diff is empty, no edit made
  - id: PIN-02-spec-scope
    result: pass
    evidence:
      - command: 'git status --porcelain'
      - command: 'git diff --stat -- docs/SPECIFICATION.md'
      - command: >-
          git diff -- docs/SPECIFICATION.md | grep -ic
          "pin-framework-version\|PIN-01\|PIN-02\|PIN-03"
      - static_analysis: >-
          pre-existing M docs/SPECIFICATION.md diff (60 insertions/35
          deletions) contains zero references to pin-framework-version or
          PIN-01/02/03; only new untracked artifacts are
          docs/spec-loop-runs/{acg6-lint,extractor-wiring-fix,pin-framework-version}/
          and scripts/check_thin_delta.sh, none of which are tracked-code
          edits by this slice
  - id: PIN-03-model-id-policy
    result: pass
    evidence:
      - static_analysis: >-
          litellm/config.yaml model entries (claude -> openai/gpt-4o-mini,
          claude-anthropic -> anthropic/claude-sonnet-4-5, claude-mock ->
          anthropic/claude-sonnet-4-5) compared against
          docs/SPECIFICATION.md:527-529 and :634-641 — both describe the
          model id as a floating fact re-verified per run; no contradiction
      - command: 'git diff -- litellm/config.yaml'
overall: pass
