services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ../../../../litellm/config.yaml:/app/config.yaml:ro
    networks:
      - llm-net

  mcp:
    build:
      context: ../../../..
      dockerfile: docker/mcp.Dockerfile
    image: mcp-n4j-memory-mcp:local
    environment:
      NAM_BACKEND: bolt
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NAM_LLM: ${NAM_LLM:-openai/claude}
      NAM_LLM_API_KEY: ${NAM_LLM_API_KEY:-${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}}
      NAM_EMBEDDING: ${NAM_EMBEDDING:-BAAI/bge-small-en-v1.5}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    networks:
      - db-net
      - llm-net

networks:
  db-net:
    internal: true
  llm-net:
    internal: true

volumes:
  neo4j-data:
