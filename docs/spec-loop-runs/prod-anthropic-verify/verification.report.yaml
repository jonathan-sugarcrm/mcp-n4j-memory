slice: prod-anthropic-verify
requirements:
  - id: R1
    result: fail
    reason: >-
      The literal Expected observable outcome ("the memory_store_message tool call
      completes successfully, no error, with a corresponding upstream response") was
      never observed, by the implementation or by this independent verification pass.
      Every triggered call (7 calls / 28 underlying requests across two cooldowns of
      60s and 90s) returned a genuine Anthropic 429 rate_limit_error. This is judged
      to be an environment blocker (Anthropic account-level rate limit) rather than a
      repo defect, but the requirement's stated outcome remains unmet and is not
      waived to pass.
    defect_type: missing_evidence
  - id: R2
    result: pass
    evidence:
      - command: >-
          docker compose logs llm-proxy | grep -c "mock-ok: llm-smoke local response"
          (implementation-captured; result 0 across the full run)
      - api_response: >-
          Genuine Anthropic error envelopes with distinct real request_ids, e.g.
          404 not_found_error request_id=req_011Cd1mWzmzYFZ1gVfTnPYUC (pre-model-fix)
          and 429 rate_limit_error request_id=req_011Cd1n1MVU6tL7jthfzinr2 (post-fix);
          28 distinct genuine request_ids total, 0 mock-string occurrences
          (implementation-captured, re-read raw by this agent, not re-executed live)
      - command: >-
          docker compose exec llm-proxy python3 -c "socket.create_connection(('api.anthropic.com',443))"
          -> CONNECT_OK (independently reproduced by this agent, corroborates the
          network path the R2 evidence claims was used)
    reason: null
  - id: R3
    result: pass
    evidence:
      - command: "docker compose exec mcp env | grep -i anthropic -> empty, exit 1 (independently reproduced)"
      - command: >-
          docker compose exec mcp python3 -c "socket.create_connection(('api.anthropic.com',443))"
          -> UNREACHABLE: [Errno -3] Temporary failure in name resolution
          (independently reproduced from a clean docker compose down -v / up -d --build)
    reason: null
  - id: R4
    result: pass
    evidence:
      - command: "docker compose config -> exit 0 (independently reproduced)"
      - static_analysis: >-
          Resolved topology (docker compose config, independently run): llm-proxy ->
          [llm-net, llm-egress-net]; mcp -> [db-net, llm-net] (unchanged); neo4j ->
          [db-net] (unchanged); llm-egress-net is the only non-internal network.
      - command: "docker compose exec llm-proxy python3 -c socket.create_connection(('api.anthropic.com',443)) -> CONNECT_OK (independently reproduced)"
      - command: "docker compose exec neo4j sh -c wget https://api.anthropic.com -> UNREACHABLE (independently reproduced)"
      - command: "docker compose exec neo4j sh -c wget http://llm-proxy:4000 -> UNREACHABLE (AC-C5 rerun, independently reproduced, no regression)"
      - command: "docker compose exec llm-proxy python3 -c socket.create_connection(('neo4j',7687)) -> UNREACHABLE (AC-C5 rerun, independently reproduced, no regression)"
    reason: null
  - id: SCOPE-model-id-change
    result: fail
    reason: >-
      litellm/config.yaml's Anthropic model id was changed
      (claude-3-5-sonnet-latest -> claude-sonnet-4-5) for both the claude and
      claude-mock entries, despite spec section 5 explicitly listing "pinning the
      exact Anthropic model id" as out of scope for this slice. The change was
      necessary (the old id 404s on Anthropic's live API, proven by a genuine
      404 not_found_error with a real request_id) but crossed an explicit scope
      fence without a stop-and-report Class 1 decision first.
    defect_type: contradictory_requirement
  - id: SCOPE-detailed-debug
    result: fail
    reason: >-
      --detailed_debug was added to llm-proxy's command in docker-compose.yml and
      left in place after the verification pass completed. It is not required by
      any R1-R4 verification method, was not specified anywhere in the spec, and
      changes llm-proxy's logging posture to capture full upstream request/response
      bodies persistently, which is a debugging artifact that should not ship.
    defect_type: unspecified_behaviour
  - id: SCOPE-mcp-extractor-wiring
    result: fail
    reason: >-
      OPENAI_API_KEY and NAM_EXTRACTION__LLM_MODEL were added to mcp's environment,
      and the openai pip extra was added to docker/mcp.Dockerfile, to work around a
      discovered gap in the vendored neo4j-agent-memory==0.2.0 package's
      create_llm_extractor(), which never wires NAM_LLM__API_KEY/NAM_LLM__MODEL into
      the actual extractor. This fix was load-bearing (R1/R2 are unexercisable
      without it) but is a distinct functional bug fix outside this slice's
      explicit in-scope list (network/egress + key-sourcing + model env var only),
      and it also implies the prior llm-smoke slice's PASS may not have exercised
      real extractor wiring.
    defect_type: new_constraint
overall: fail
