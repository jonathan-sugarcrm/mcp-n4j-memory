services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-change-me}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - db-net

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-change-me}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-change-me}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - llm-net
      - llm-egress-net

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NAM_LLM__PROVIDER: ${NAM_LLM__PROVIDER:-openai}
      NAM_LLM__MODEL: ${NAM_LLM__MODEL:-claude}
      NAM_LLM__API_KEY: ${NAM_LLM__API_KEY:-change-me}
      # The framework's LLMEntityExtractor stage uses the openai SDK directly
      # and reads OPENAI_API_KEY (not NAM_LLM__API_KEY) when no api_key is
      # passed explicitly. Must match llm-proxy's LITELLM_MASTER_KEY so the
      # openai client can authenticate to the proxy (this is the LiteLLM
      # virtual key, never the real ANTHROPIC_API_KEY).
      OPENAI_API_KEY: ${NAM_LLM__API_KEY:-change-me}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://llm-proxy:4000/v1}
      # The framework's ExtractionConfig.llm_model (default gpt-4o-mini) is a
      # separate setting from NAM_LLM__MODEL and is not derived from it; must
      # be set explicitly so the LLMEntityExtractor stage requests the same
      # model configured on llm-proxy.
      NAM_EXTRACTION__LLM_MODEL: ${NAM_LLM__MODEL:-claude}
      NAM_EMBEDDING__PROVIDER: ${NAM_EMBEDDING__PROVIDER:-sentence_transformers}
      NAM_EMBEDDING__MODEL: ${NAM_EMBEDDING__MODEL:-BAAI/bge-small-en-v1.5}
      NAM_EMBEDDING__DIMENSIONS: ${NAM_EMBEDDING__DIMENSIONS:-384}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    depends_on:
      neo4j:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - db-net
      - llm-net

networks:
  db-net:
    internal: true
  llm-net:
    internal: true
  # Non-internal: gives llm-proxy (only) a route to the public internet so it
  # can reach api.anthropic.com. mcp/neo4j are not attached to this network.
  llm-egress-net: {}

volumes:
  neo4j-data:
